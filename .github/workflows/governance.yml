name: "Governance Pipeline - Code Quality & Coverage"
on:
  pull_request:
    paths-ignore:
      - '*.md'
      - 'LICENSE'
      - 'data/static/i18n/*.json'
      - 'frontend/src/assets/i18n/*.json'

env:
  NODE_DEFAULT_VERSION: 22
  NODE_OPTIONS: "--max_old_space_size=4096"
  COMPLEXITY_THRESHOLD: 15
  COVERAGE_LINES_THRESHOLD: 25
  COVERAGE_FUNCTIONS_THRESHOLD: 20
  COVERAGE_BRANCHES_THRESHOLD: 20
  COVERAGE_STATEMENTS_THRESHOLD: 25

jobs:
  governance-metrics:
    name: "Governance Metrics (Coverage + Complexity)"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 #v4.2.2

      - name: "Use Node.js 22"
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af #v4.1.0
        with:
          node-version: ${{ env.NODE_DEFAULT_VERSION }}

      - name: "Install dependencies"
        run: npm install

      - name: "Execute server tests (coverage source)"
        run: npm run test:server

      - name: "Coverage Gate"
        run: >
          npx nyc check-coverage
          --report-dir=./build/reports/coverage/server-tests
          --lines=${{ env.COVERAGE_LINES_THRESHOLD }}
          --functions=${{ env.COVERAGE_FUNCTIONS_THRESHOLD }}
          --branches=${{ env.COVERAGE_BRANCHES_THRESHOLD }}
          --statements=${{ env.COVERAGE_STATEMENTS_THRESHOLD }}

      - name: "Cyclomatic Complexity Gate"
        run: >
          npx eslint app.ts server.ts lib models routes data
          --ext .ts
          --rule 'complexity:["error",${{ env.COMPLEXITY_THRESHOLD }}]'
          --max-warnings 0

      - name: "Upload coverage artifacts"
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b #v4.5.0
        with:
          name: governance-coverage
          path: build/reports/coverage/server-tests/lcov.info

  quality-gate:
    name: "SonarQube Quality Gate"
    needs: governance-metrics
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 #v4.2.2
        with:
          fetch-depth: 0

      - name: "Use Node.js 22"
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af #v4.1.0
        with:
          node-version: ${{ env.NODE_DEFAULT_VERSION }}

      - name: "Install dependencies"
        run: npm install

      - name: "Generate coverage for SonarQube"
        run: npm run test:server

      - name: "SonarCloud Scan"
        uses: SonarSource/sonarqube-scan-action@v5.3.1
        if: env.SONAR_TOKEN != ''
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Warn when Sonar token is missing"
        if: env.SONAR_TOKEN == ''
        run: echo "::warning::SONAR_TOKEN is not configured. SonarQube Quality Gate was skipped."

      - name: "Comment PR with results"
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## 📊 Governance Report\n\n- ✅ Coverage gate and cyclomatic complexity gate executed in CI\n- ✅ SonarQube Quality Gate executed when `SONAR_TOKEN` is available\n- 📍 [View Sonar dashboard](https://sonarcloud.io/project/overview?id=JAL0NS0_juice-shop)'
            })
