name: "Governance Pipeline - Code Quality & Coverage"
on:
  push:
    branches:
      - develop
      - master
    paths-ignore:
      - '*.md'
      - 'LICENSE'
      - 'monitoring/**'
      - 'screenshots/**'
  pull_request:
    paths-ignore:
      - '*.md'
      - 'LICENSE'
      - 'data/static/i18n/*.json'
      - 'frontend/src/assets/i18n/*.json'

env:
  NODE_DEFAULT_VERSION: 22
  NODE_OPTIONS: "--max_old_space_size=4096"

jobs:
  quality-gate:
    name: "SonarCloud Quality Gate"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 #v4.2.2
        with:
          fetch-depth: 0

      - name: "SonarCloud Scan"
        uses: SonarSource/sonarqube-scan-action@master
        with:
          args: >
            -Dsonar.projectKey=JAL0NS0_juice-shop
            -Dsonar.organization=j-al0ns0
            -Dsonar.sources=app.ts,server.ts,lib,models,routes,data,views
            -Dsonar.exclusions=**/node_modules/**,**/build/**,**/dist/**,**/*.spec.ts,cypress/**,test/**
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Comment PR with results"
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 📊 Quality Gate Report\n📍 [View on SonarCloud](https://sonarcloud.io/project/overview?id=JAL0NS0_juice-shop)`
            })
