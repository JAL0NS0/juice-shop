# SonarCloud Project Configuration
# ================================
# This file declares the SonarCloud analysis parameters for Juice Shop

# Project Identification
sonar.projectKey=juice-shop
sonar.projectName=Juice Shop - OWASP Security Training
sonar.projectVersion=19.1.1
sonar.organization=j-al0ns0

# Source Code Location
sonar.sources=app.ts,server.ts,lib,models,routes,data,views
sonar.sourceEncoding=UTF-8

# Exclusions
sonar.exclusions=\
  **/node_modules/**,\
  **/build/**,\
  **/dist/**,\
  **/*.spec.ts,\
  **/*.test.ts,\
  cypress/**,\
  test/**,\
  frontend/node_modules/**,\
  monitoring/**,\
  vagrant/**,\
  encryptionkeys/**

# Test Reporting
sonar.tests=test,frontend/src,cypress
sonar.test.inclusions=\
  **/*.spec.ts,\
  **/*.test.ts,\
  cypress/**/*.cy.ts

# Code Coverage Configuration
sonar.javascript.lcov.reportPaths=\
  build/reports/coverage/frontend-tests/lcov.info,\
  build/reports/coverage/server-tests/lcov.info,\
  build/reports/coverage/api-tests/lcov.info

# TypeScript & JavaScript Analysis
sonar.typescript.tsconfigPath=tsconfig.json
sonar.javascript.file.suffixes=.js,.ts,.tsx

# Quality Gate Configuration
# Fail PR if Quality Gate does not pass
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# Governance Metrics (New Code - Pull Requests)
# ============================================
# These metrics are specifically for new code to enforce quality standards

# Code Coverage (New Code)
# Fail if new code coverage is less than 80%
sonar.newCodeDefinition=previous_version

# Complexity Metrics  
# Tracked automatically by SonarCloud - flagged in Quality Gate if threshold exceeded
# Default: Cyclomatic Complexity per function <= 15

# Security Hotspots
# All new security hotspots will be flagged in PR comments

# Issue Exclusion Rules
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=*/
sonar.issue.ignore.multicriteria.e1.resourceKey=encryptionkeys/**

# Miscellaneous
sonar.host.url=https://sonarcloud.io
sonar.scm.disabled=false
sonar.scm.forceDetection=true
