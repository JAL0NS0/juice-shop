services:
  juice-shop-demo:
    profiles: ["demo"]
    image: bkimminich/juice-shop:latest
    container_name: juice-shop-demo
    ports:
      - "3000:3000"
    restart: unless-stopped

  juice-shop-source:
    profiles: ["source"]
    build:
      context: .
      dockerfile: Dockerfile
    image: juice-shop-local:latest
    container_name: juice-shop-source
    ports:
      - "3001:3000"
    restart: unless-stopped
